[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lingban-production-pipeline"
version = "0.2.1"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.2.11,<1.3", "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2.12,<3", "numpy>=2,<3", "scipy>=1.13,<2",
  "soundfile>=0.13,<0.14", "httpx>=0.28,<0.29", "websocket-client>=1.8,<2"
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.scripts]
lingban = "lingban_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
