version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: storygenerate-pg
    environment:
      POSTGRES_USER: storygen
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD through the environment}"
      POSTGRES_DB: storygenerate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storygen -d storygenerate"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
